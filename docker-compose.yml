name: apex-ops

services:
  api:
    image: apex-ops-api:${APP_VERSION:-1.0.0}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DB_PATH: /data/ops.db
      FAULT_INJECTION: ${FAULT_INJECTION:-}
    volumes:
      - ops-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  ops-data:
